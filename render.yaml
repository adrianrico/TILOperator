# Blueprint de Render: sitio estático (SPA) servido desde dist/.
services:
  - type: web
    name: til-operator
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://til-backend.onrender.com/api/v1
    routes:
      # SPA: cualquier ruta devuelve index.html (el router es del cliente).
      - type: rewrite
        source: /*
        destination: /index.html
    # Cabeceras de seguridad aplicadas a todas las respuestas.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://til-backend.onrender.com/api/v1; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
